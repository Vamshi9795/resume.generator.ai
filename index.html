<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Resume Generator</title>
<!-- PDF generation library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>
<style>
body { font-family: sans-serif; max-width: 760px;
margin: 40px auto; padding: 0 20px; }
h1 { font-size: 1.8rem; margin-bottom: 4px; }
p.sub { color: #666; margin-top: 0; }
label { display:block; font-weight:600;
font-size:0.8rem; margin: 16px 0 4px; }
textarea, input { width:100%; padding:10px;
border:1px solid #ccc; border-radius:6px;
font-size:0.9rem; box-sizing:border-box; }
textarea { min-height: 140px; resize: vertical; }
.toggles { display:flex; gap:10px; margin:12px 0; }
.toggle { padding:8px 16px; border:1px solid #ccc;
border-radius:6px; cursor:pointer;
font-size:0.85rem; background:white; }
.toggle.on { background:#1a3a2a; color:white;
border-color:#1a3a2a; }
button.gen { width:100%; padding:12px;
background:#c84b2f; color:white; border:none;
border-radius:6px; font-size:1rem;
cursor:pointer; margin-top:8px; }
button.gen:disabled { opacity:0.4; cursor:not-allowed; }
#output { margin-top:28px; display:none; }
.tabs { display:flex; gap:8px; margin-bottom:12px; }
.tab { padding:6px 14px; border:1px solid #ccc;
border-radius:4px; cursor:pointer;
font-size:0.8rem; background:white; }
.tab.active { background:#111; color:white;
border-color:#111; }
.box { background:#fff; border:1px solid #ddd;
border-radius:6px; padding:20px;
white-space:pre-wrap; font-size:0.88rem;
line-height:1.7; position:relative; }
.copy { position:absolute; top:12px; right:12px;
padding:4px 12px; font-size:0.75rem;
border:1px solid #ccc; border-radius:4px;
background:#f5f5f5; cursor:pointer; }
.dl { margin-top:10px; padding:8px 16px;
background:#1a3a2a; color:white; border:none;
border-radius:4px; cursor:pointer;
     font-size:0.85rem; }
.loader { display:flex; align-items:center;
gap:10px; color:#888; padding:16px 0; }
.spinner { width:18px; height:18px;
border:2px solid #ddd; border-top-color:#c84b2f;
border-radius:50%;
animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.err { background:#fff0f0; border:1px solid #fcc;
border-radius:6px; padding:10px 14px;
color:#c00; font-size:0.85rem;
margin-top:10px; display:none; }
</style>
</head>
<body>
<h1>Resume Generator</h1>
<p class="sub">Paste a job description. Get a tailored resume
and cover letter.</p>
<label>Job Description</label>
<textarea id="jd"
placeholder="Paste the full job description here...">
</textarea>
<label>Your Background</label>
<textarea id="bg" style="min-height:100px"
placeholder="e.g. 4 years as a Data Analyst, strong SQL/Python/
Power BI, M.S. Computer Science..."></textarea>
<label>Generate</label>
<div class="toggles">
<div class="toggle on" id="t-resume"
onclick="this.classList.toggle(’on’)">
Resume summary + bullets
</div>
<div class="toggle on" id="t-cover"
onclick="this.classList.toggle(’on’)">
Cover letter
</div>
</div>
<button class="gen" id="btn" onclick="generate()">
Generate Documents
</button>
<div class="err" id="err"></div>
<div id="output">
<div class="tabs" id="tabs"></div>
<div id="panels"></div>
</div>
<script>
  const KEY = ’YOUR_GEMINI_API_KEY’; // <-- paste your key here
async function generate() {
const jd = document.getElementById(’jd’).value.trim();
const bg = document.getElementById(’bg’).value.trim();
const doR = document.getElementById(’t-resume’)
.classList.contains(’on’);
const doC = document.getElementById(’t-cover’)
.classList.contains(’on’);
const btn = document.getElementById(’btn’);
const err = document.getElementById(’err’);
err.style.display = ’none’;
if (!jd) { showErr(’Please paste a job description.’); return; }
if (!doR && !doC) { showErr(’Select at least one document.’); return; }
btn.disabled = true;
btn.textContent = ’Generating...’;
document.getElementById(’output’).style.display = ’none’;
const prompt = buildPrompt(jd, bg, doR, doC);
try {
const res = await fetch(
’https://generativelanguage.googleapis.com/v1beta/’ +
’models/gemini-1.5-flash:generateContent?key=’ + KEY,
{
method: ’POST’,
headers: { ’Content-Type’: ’application/json’ },
body: JSON.stringify({
contents: [{ parts: [{ text: prompt }] }]
})
}
);
const data = await res.json();
if (!res.ok) throw new Error(
data.error?.message || ’API error’
);
const text =
data.candidates[0].content.parts[0].text;
renderOutput(text, doR, doC);
} catch(e) {
showErr(’Error: ’ + e.message);
} finally {
btn.disabled = false;
btn.textContent = ’Generate Documents’;
}
}
function buildPrompt(jd, bg, doR, doC) {
return ‘
You are an expert resume writer and career coach.
Generate the requested documents based on the job
  description and candidate background below.
Be specific, use the JD’s exact language, and include
metrics wherever possible.
JOB DESCRIPTION:
${jd}
CANDIDATE BACKGROUND:
${bg || ’Experienced analyst with 4+ years in data, SQL, and BI tools.’}
${doR ? ‘
---RESUME---
Write:
1. SUMMARY: A 3-4 sentence tailored summary mirroring
the JD language. Label it "SUMMARY:"
2. KEY BULLETS: 4 strong bullet points for the most
recent role, each with an action verb and a metric.
Label them "KEY BULLETS:"
‘ : ’’}
${doC ? ‘
---COVER LETTER---
Write a 4-paragraph story-driven cover letter. Label it
"COVER LETTER:"
Structure:
1. Hook: memorable opening, why this company/role
2. Proof: 2-3 accomplishments with metrics matching JD
3. Fit: why this company using their own JD language
4. Close: warm and confident, 1-2 sentences
Tone: human, confident, first-person. No clich´es.
‘ : ’’}
‘.trim();
}
function renderOutput(text, doR, doC) {
const tabs = document.getElementById(’tabs’);
const panels = document.getElementById(’panels’);
tabs.innerHTML = panels.innerHTML = ’’;
const sections = [];
if (doR) {
const sum = (text.match(/SUMMARY:([\s\S]*?)(?=KEY BULLETS:|COVER LETTER:|$)/i)||[])[1]||’’;
const bul = (text.match(/KEY BULLETS:([\s\S]*?)(?=COVER LETTER:|$)/i)||[])[1]||’’;
if (sum||bul) sections.push({
label: ’Resume’,
content: ’SUMMARY\n\n’ + sum.trim() +
’\n\nKEY BULLETS\n\n’ + bul.trim()
});
}
if (doC) {
const cl = (text.match(/COVER LETTER:([\s\S]*?)$/i)||[])[1]
  || (!doR ? text : ’’);
if (cl) sections.push({
label: ’Cover Letter’, content: cl.trim()
});
}
if (!sections.length)
sections.push({ label: ’Output’, content: text });
sections.forEach((s, i) => {
const tab = document.createElement(’div’);
tab.className = ’tab’ + (i===0?’ active’:’’);
tab.textContent = s.label;
tab.onclick = () => {
document.querySelectorAll(’.tab’)
.forEach(t=>t.classList.remove(’active’));
document.querySelectorAll(’.panel’)
.forEach(p=>p.style.display=’none’);
tab.classList.add(’active’);
document.getElementById(’p’+i).style.display=’block’;
};
tabs.appendChild(tab);
const panel = document.createElement(’div’);
panel.className = ’panel’;
panel.id = ’p’ + i;
panel.style.display = i===0 ? ’block’ : ’none’;
panel.innerHTML = ‘
<div class="box" id="box${i}">
<button class="copy"
onclick="copyText(${i})">Copy</button>
${s.content.replace(/</g,’&lt;’)}
</div>
<button class="dl"
onclick="downloadPDF(${i},’${s.label}’)">
Download PDF
</button>‘;
panels.appendChild(panel);
});
document.getElementById(’output’).style.display = ’block’;
}
function copyText(i) {
const box = document.getElementById(’box’+i);
const text = box.innerText.replace(’Copy’,’’).trim();
navigator.clipboard.writeText(text).then(() => {
const btn = box.querySelector(’.copy’);
btn.textContent = ’Copied!’;
setTimeout(() => btn.textContent = ’Copy’, 2000);
});
}
  function downloadPDF(i, label) {
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
const box = document.getElementById(’box’+i);
const text = box.innerText.replace(’Copy’,’’).trim();
const lines = doc.splitTextToSize(text, 180);
doc.setFont(’helvetica’,’normal’);
doc.setFontSize(11);
doc.text(lines, 15, 20);
doc.save(label.replace(’ ’,’_’) + ’.pdf’);
}
function showErr(msg) {
const el = document.getElementById(’err’);
el.textContent = msg;
el.style.display = ’block’;
}
</script>
</body>
</html>
